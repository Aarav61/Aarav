name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build EXE
        run: python -m PyInstaller --onefile --windowed --name PC-Shutdown-Timer shutdown_timer.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PC-Shutdown-Timer-Windows
          path: dist/PC-Shutdown-Timer.exe
